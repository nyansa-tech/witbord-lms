# Witbord LMS — production Docker Compose (EC2)
#
# Usage on the server (from the repo root):
#   cp deploy/.env.example deploy/.env   # then edit secrets
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
#
# Expects deploy/config/*.yml templates (copied into config/ on first boot by scripts/first_boot.sh)
# or bind-mounted as below.

services:
  web: &WEB
    build:
      context: ..
      dockerfile: Dockerfile.production
      args:
        USER_ID: ${HOST_USER_ID:-1000}
    image: witbord-lms:${WITBORD_IMAGE_TAG:-prod}
    restart: unless-stopped
    environment: &WEB_ENV
      RAILS_ENV: production
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      CANVAS_DATABASE_HOST: postgres
      CANVAS_DATABASE_USERNAME: postgres
      CANVAS_DATABASE_PRODUCTION: canvas_production
      VIRTUAL_HOST: ${CANVAS_DOMAIN:-learn.witbord.com}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-af-south-1}
    volumes:
      - ../config:/usr/src/app/config
      - brandable_css_brands:/usr/src/app/app/stylesheets/brandable_css_brands
      - public_dist:/usr/src/app/public/dist
      - log:/usr/src/app/log
      - tmp:/usr/src/app/tmp
      - canvas_files:/usr/src/app/tmp/files
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - witbord

  jobs:
    <<: *WEB
    command: bundle exec script/delayed_job run
    ports: []

  postgres:
    build:
      context: ../docker-compose/postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: postgres
      POSTGRES_DB: canvas_production
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - witbord

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - witbord

  # Terminates TLS with Cloudflare Origin Certificate; proxies to Canvas web:80
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/witbord.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - web
    networks:
      - witbord

volumes:
  pg_data:
  redis_data:
  brandable_css_brands:
  public_dist:
  log:
  tmp:
  canvas_files:

networks:
  witbord:
    driver: bridge
