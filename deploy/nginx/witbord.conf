# Nginx terminates TLS using a Cloudflare Origin Certificate.
# Place origin.pem and origin.key in deploy/certs/ on the server.

upstream witbord_web {
  server web:80;
}

server {
  listen 80;
  server_name learn.witbord.com *.witbord.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name learn.witbord.com *.witbord.com;

  ssl_certificate     /etc/nginx/certs/origin.pem;
  ssl_certificate_key /etc/nginx/certs/origin.key;
  ssl_protocols       TLSv1.2 TLSv1.3;

  client_max_body_size 10g;

  location / {
    proxy_pass http://witbord_web;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 300s;
  }
}
